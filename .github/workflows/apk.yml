name: Build Android APK
run-name: APK build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Unique build identifier"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare app files
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          python3 -m pip install --user pillow
          python3 - <<'PY'
          import json, os, pathlib, re, html
          from PIL import Image, ImageDraw
          build_id = os.environ["BUILD_ID"]
          if not re.fullmatch(r"[a-f0-9]{32}", build_id):
              raise SystemExit("Invalid build ID")
          source = pathlib.Path("uploads") / build_id
          app_assets = pathlib.Path("app/src/main/assets")
          app_assets.mkdir(parents=True, exist_ok=True)
          html_file = source / "index.html"
          if not html_file.is_file():
              raise SystemExit("Uploaded HTML file not found")
          (app_assets / "index.html").write_bytes(html_file.read_bytes())
          metadata = json.loads((source / "metadata.json").read_text(encoding="utf-8"))
          name = str(metadata.get("appName", "HTML App"))[:40]
          strings = '<resources><string name="app_name">' + html.escape(name) + '</string></resources>'
          pathlib.Path("app/src/main/res/values/strings.xml").write_text(strings, encoding="utf-8")
          icon_path = source / "icon.bin"
          if icon_path.exists():
              icon = Image.open(icon_path).convert("RGBA")
          else:
              icon = Image.new("RGBA", (512, 512), (26, 31, 54, 255))
              draw = ImageDraw.Draw(icon)
              draw.rounded_rectangle((55, 55, 457, 457), radius=95, fill=(126, 105, 255, 255))
              draw.text((155, 205), "HTML", fill="white", stroke_width=1)
          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          for density, size in sizes.items():
              folder = pathlib.Path("app/src/main/res") / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              icon.resize((size, size), Image.Resampling.LANCZOS).save(folder / "ic_launcher.png")
          PY

      - name: Build APK
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: gradle --no-daemon assembleDebug -PbuildId="$BUILD_ID"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
